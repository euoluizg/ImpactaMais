<div class="butt-wrapper">
  <button 
    class="btn"
    type="button"
    (click)="action.emit()"
    [style.background-color]="backgroundColor"
    [style.color]="textColor"
    [style.font-size]="fontSize"
    [style.border-radius]="borderRadius"
    [style.width]="width"
    [style.padding]="padding"
    [style.font-weight]="fontWeight"
    [style.border]="border"
  >
    {{ label }}
  </button>
</div>
