<div class="input-wrapper">
    @if (label) {
        <label [for]="inputName"> {{ label }}</label>
    }
    <div class="input-content">
        @if (type === 'textarea') {
            <textarea
                [id]="inputName"
                [placeholder]="placeholder"
                [value]="value"
                (input)="onInput($event)"
                (blur)="onTouched()"
                rows="4"
                class="base-field"
            ></textarea>
        } @else {
            <input 
                [id]="inputName"
                [type]="type" 
                [placeholder]="placeholder" 
                [value]="value"
                (input)="onInput($event)"
                (blur)="onTouched()"
                class="base-field"
            />
        }
    </div>
</div>
