<div class="container">
    <div class="topBar">
        <p>Pequenas ações, grandes transformações</p>
    </div>
    <navBar1Component></navBar1Component>

    <div id="info">
        <div class="info">
            <h1>Fale Conosco</h1>
            <p class="subtitleInfo">Pelo canal de atendimento ao cliente estamos disponíveis para ajudar!</p>
            <h3>Nossos Contatos:</h3>
            <p class="contactInfo">📱 (82) 99999-9999</p>
            <p class="contactInfo">📞 (82) 3333-3333</p>
            <p class="contactInfo">✉️ contato@conectae.com.br</p>
        </div>
        <div class="form">
            <h1>Preencha o formulário</h1>
            <form [formGroup]="contatoForm">
                <div class="formRow">
                <InputComponent 
                    formControlName="nome"
                    inputName="nome"
                    type="email"
                    label="Nome"
                    placeholder="Digite seu nome"
                />
                <InputComponent 
                    formControlName="telefone"
                    inputName="telefone"
                    type="tel"
                    label="Telefone"
                    placeholder="Digite seu telefone"
                />
                </div>
                <InputComponent class="email"
                    formControlName="email"
                    inputName="email"
                    type="email"
                    label="Email"
                    placeholder="Digite seu email"
                />
                <InputComponent class="message"
                    formControlName="mensagem"
                    inputName="mensagem"
                    type="textarea"
                    label="Mensagem"
                    placeholder="Digite sua mensagem"
                    img="none"
                />
            </form>
        </div>
    </div>

    <footer1Component></footer1Component>
</div>
